<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" style="background:#F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <!-- 卡片柔和轻阴影 -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <!-- 上次阅读 Hero 卡片微光阴影 -->
    <filter id="hero-shadow" x="-6%" y="-6%" width="112%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- 页面底色：Clean Light Slate 50 浅底 -->
  <rect width="375" height="812" fill="#F8FAFC"/>

  <!-- ==================== 1. 顶部状态栏 & 导航栏 (0 ~ 88px) ==================== -->
  <g id="nav-bar">
    <!-- 状态栏 -->
    <text x="24" y="32" font-size="12" fill="#64748B" font-weight="500">9:41</text>
    <rect x="318" y="22" width="22" height="11" rx="3" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <rect x="320" y="24" width="15" height="7" rx="1.5" fill="#64748B"/>
    <circle cx="304" cy="27" r="3" fill="#64748B"/>

    <!-- 导航标题区 (左对齐大标题模式) -->
    <g transform="translate(20, 46)">
      <text x="0" y="22" font-size="20" font-weight="800" fill="#0F172A" letter-spacing="-0.3">技术精读</text>
      <text x="88" y="21" font-size="11" font-weight="500" fill="#64748B">· 原生 RFC 与英文技术文档</text>
    </g>

    <!-- 微信小程序原生胶囊 -->
    <rect x="282" y="46" width="80" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="305" cy="61" r="3.5" fill="#64748B"/>
    <circle cx="312" cy="61" r="1.5" fill="#94A3B8"/>
    <circle cx="337" cy="61" r="5" fill="none" stroke="#64748B" stroke-width="1.5"/>

    <line x1="0" y1="88" x2="375" y2="88" stroke="#F1F5F9" stroke-width="1"/>
  </g>

  <!-- ==================== 2. 「继续上次阅读」快速直达卡片 (98 ~ 206px) ==================== -->
  <g id="continue-reading-hero" transform="translate(16, 98)" filter="url(#hero-shadow)">
    <!-- 卡片主体背景：白色纯净卡片 + 细深色边框 -->
    <rect width="343" height="106" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- 左侧高亮装饰条 (强调当前处于在读活跃态) -->
    <rect x="0" y="16" width="4" height="74" rx="2" fill="#0F172A"/>

    <g transform="translate(16, 14)">
      <!-- 顶栏状态与标签 -->
      <g transform="translate(0, 0)">
        <!-- 标签：上次阅读 -->
        <rect x="0" y="0" width="68" height="18" rx="4" fill="#F1F5F9"/>
        <text x="34" y="13" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">上次阅读</text>

        <!-- 进度徽章 -->
        <rect x="74" y="0" width="76" height="18" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.8"/>
        <text x="112" y="13" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">读至 68%</text>

        <!-- 右侧时间 -->
        <text x="310" y="13" font-size="10" fill="#94A3B8" text-anchor="end">3 分钟前阅读</text>
      </g>

      <!-- 文章标题与分类属性 -->
      <g transform="translate(0, 26)">
        <text x="0" y="16" font-size="15" font-weight="800" fill="#0F172A">Understanding TCP Handshake</text>
        <text x="0" y="32" font-size="11" fill="#64748B">网络与分布式协议 · 185 词 · RFC 793 规范</text>
      </g>

      <!-- 底部进度条与一键直达按钮 -->
      <g transform="translate(0, 64)">
        <!-- 细进度底槽 -->
        <rect x="0" y="7" width="205" height="5" rx="2.5" fill="#F1F5F9"/>
        <!-- 实际进度 -->
        <rect x="0" y="7" width="140" height="5" rx="2.5" fill="#0F172A"/>

        <!-- 一键直达按钮 (深色高辨识度药丸) -->
        <g transform="translate(220, -5)" cursor="pointer">
          <rect width="90" height="28" rx="14" fill="#0F172A"/>
          <text x="45" y="18" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">继续阅读 ›</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== 3. 搜索与微统计栏 (216 ~ 254px) ==================== -->
  <g id="search-bar" transform="translate(16, 216)">
    <rect width="343" height="38" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <!-- 搜索放大镜图标 -->
    <circle cx="16" cy="19" r="5" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="20" y1="23" x2="25" y2="28" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="34" y="24" font-size="12" fill="#94A3B8">搜索技术文献、RFC 规范或专业词汇...</text>
  </g>

  <!-- ==================== 4. 文章分类区域标题 (266 ~ 288px) ==================== -->
  <g id="section-title" transform="translate(20, 280)">
    <text x="0" y="0" font-size="15" font-weight="800" fill="#0F172A">技术领域精选分类</text>
    <rect x="135" y="-12" width="48" height="18" rx="9" fill="#EFF6FF"/>
    <text x="159" y="1" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">5 个领域</text>

    <text x="335" y="0" font-size="11" fill="#94A3B8" text-anchor="end">共 36 篇文献</text>
  </g>

  <!-- ==================== 5. 分类卡片流 (296 ~ 716px) ==================== -->
  <g id="categories-list">
    
    <!-- 分类 1: 网络与分布式协议 (Networking & Protocols) -->
    <g transform="translate(16, 296)" filter="url(#card-shadow)" cursor="pointer">
      <rect width="343" height="74" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- 领域图标块 (浅蓝) -->
      <g transform="translate(12, 15)">
        <rect width="44" height="44" rx="10" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
        <!-- 网络拓扑 SVG 图标 -->
        <circle cx="22" cy="16" r="3.5" fill="#2563EB"/>
        <circle cx="14" cy="28" r="3.5" fill="#2563EB"/>
        <circle cx="30" cy="28" r="3.5" fill="#2563EB"/>
        <line x1="22" y1="16" x2="14" y2="28" stroke="#2563EB" stroke-width="1.5"/>
        <line x1="22" y1="16" x2="30" y2="28" stroke="#2563EB" stroke-width="1.5"/>
      </g>

      <!-- 中间文本信息 -->
      <g transform="translate(68, 22)">
        <text x="0" y="12" font-size="14" font-weight="800" fill="#0F172A">网络与分布式协议</text>
        <rect x="122" y="-1" width="76" height="16" rx="3" fill="#F1F5F9"/>
        <text x="160" y="11" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">TCP · HTTP/3 · QUIC</text>

        <text x="0" y="32" font-size="11" fill="#64748B">共 8 篇精选 · 已读 5 篇 (62%) · 涵盖 RFC 规范</text>
      </g>

      <!-- 右侧轻标签与箭头 -->
      <g transform="translate(305, 30)">
        <text x="0" y="12" font-size="12" font-weight="700" fill="#2563EB">5/8</text>
        <!-- 右箭头 -->
        <path d="M22 6L26 10L22 14" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- 分类 2: 操作系统与并发内核 (OS & Concurrency) -->
    <g transform="translate(16, 380)" filter="url(#card-shadow)" cursor="pointer">
      <rect width="343" height="74" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- 领域图标块 (浅琥珀黄) -->
      <g transform="translate(12, 15)">
        <rect width="44" height="44" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
        <!-- CPU / 线程锁图标 -->
        <rect x="14" y="14" width="16" height="16" rx="3" fill="none" stroke="#D97706" stroke-width="1.5"/>
        <circle cx="22" cy="22" r="3" fill="#D97706"/>
        <line x1="22" y1="10" x2="22" y2="14" stroke="#D97706" stroke-width="1.5"/>
        <line x1="22" y1="30" x2="22" y2="34" stroke="#D97706" stroke-width="1.5"/>
        <line x1="10" y1="22" x2="14" y2="22" stroke="#D97706" stroke-width="1.5"/>
        <line x1="30" y1="22" x2="34" y2="22" stroke="#D97706" stroke-width="1.5"/>
      </g>

      <g transform="translate(68, 22)">
        <text x="0" y="12" font-size="14" font-weight="800" fill="#0F172A">操作系统与并发内核</text>
        <rect x="135" y="-1" width="68" height="16" rx="3" fill="#F1F5F9"/>
        <text x="169" y="11" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">POSIX · 死锁 · 锁</text>

        <text x="0" y="32" font-size="11" fill="#64748B">共 7 篇精选 · 已读 3 篇 (43%) · 线程与调度</text>
      </g>

      <g transform="translate(305, 30)">
        <text x="0" y="12" font-size="12" font-weight="700" fill="#D97706">3/7</text>
        <path d="M22 6L26 10L22 14" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- 分类 3: 分布式架构与高可用 (Distributed Systems) -->
    <g transform="translate(16, 464)" filter="url(#card-shadow)" cursor="pointer">
      <rect width="343" height="74" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- 领域图标块 (浅紫) -->
      <g transform="translate(12, 15)">
        <rect width="44" height="44" rx="10" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>
        <!-- 集群共识节点图标 -->
        <rect x="14" y="15" width="7" height="7" rx="1.5" fill="#9333EA"/>
        <rect x="23" y="15" width="7" height="7" rx="1.5" fill="#9333EA"/>
        <rect x="18" y="24" width="8" height="8" rx="1.5" fill="#9333EA"/>
      </g>

      <g transform="translate(68, 22)">
        <text x="0" y="12" font-size="14" font-weight="800" fill="#0F172A">分布式架构与高可用</text>
        <rect x="135" y="-1" width="72" height="16" rx="3" fill="#F1F5F9"/>
        <text x="171" y="11" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Raft · 幂等 · 容灾</text>

        <text x="0" y="32" font-size="11" fill="#64748B">共 8 篇精选 · 已读 2 篇 (25%) · 高并发一致性</text>
      </g>

      <g transform="translate(305, 30)">
        <text x="0" y="12" font-size="12" font-weight="700" fill="#9333EA">2/8</text>
        <path d="M22 6L26 10L22 14" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- 分类 4: 存储引擎与算法结构 (Storage & Algorithms) -->
    <g transform="translate(16, 548)" filter="url(#card-shadow)" cursor="pointer">
      <rect width="343" height="74" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- 领域图标块 (浅翠绿) -->
      <g transform="translate(12, 15)">
        <rect width="44" height="44" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
        <!-- 数据库柱状图标 -->
        <ellipse cx="22" cy="16" rx="9" ry="4" fill="none" stroke="#059669" stroke-width="1.5"/>
        <path d="M13 16V26C13 28.2 17 30 22 30C27 30 31 28.2 31 26V16" fill="none" stroke="#059669" stroke-width="1.5"/>
      </g>

      <g transform="translate(68, 22)">
        <text x="0" y="12" font-size="14" font-weight="800" fill="#0F172A">存储引擎与算法结构</text>
        <rect x="135" y="-1" width="70" height="16" rx="3" fill="#F1F5F9"/>
        <text x="170" y="11" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">LSM · B+Tree · 树</text>

        <text x="0" y="32" font-size="11" fill="#64748B">共 7 篇精选 · 已读 4 篇 (57%) · 索引与持久化</text>
      </g>

      <g transform="translate(305, 30)">
        <text x="0" y="12" font-size="12" font-weight="700" fill="#059669">4/7</text>
        <path d="M22 6L26 10L22 14" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- 分类 5: 云原生与微服务通信 (Cloud Native & Service Mesh) -->
    <g transform="translate(16, 632)" filter="url(#card-shadow)" cursor="pointer">
      <rect width="343" height="74" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- 领域图标块 (浅冷灰) -->
      <g transform="translate(12, 15)">
        <rect width="44" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <!-- 云朵/容器图标 -->
        <path d="M16 26C14 26 12 24.5 12 22.5C12 20.8 13.3 19.4 15 19.1C15.5 16.2 18 14 21 14C23.5 14 25.6 15.4 26.5 17.6C27 17.3 27.5 17.1 28.1 17.1C30.3 17.1 32 18.9 32 21.1C32 23.3 30.3 25.1 28.1 25.1" fill="none" stroke="#475569" stroke-width="1.5"/>
      </g>

      <g transform="translate(68, 22)">
        <text x="0" y="12" font-size="14" font-weight="800" fill="#0F172A">云原生与微服务通信</text>
        <rect x="135" y="-1" width="70" height="16" rx="3" fill="#F1F5F9"/>
        <text x="170" y="11" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">gRPC · K8s · 网关</text>

        <text x="0" y="32" font-size="11" fill="#64748B">共 6 篇精选 · 已读 1 篇 (17%) · 边车与治理</text>
      </g>

      <g transform="translate(305, 30)">
        <text x="0" y="12" font-size="12" font-weight="700" fill="#64748B">1/6</text>
        <path d="M22 6L26 10L22 14" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

  </g>

  <!-- ==================== 6. 底部 TabBar 导航 (728 ~ 812px) ==================== -->
  <g id="tab-bar" transform="translate(0, 728)">
    <rect width="375" height="84" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="375" y2="0" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Tab 1: 学习 -->
    <g transform="translate(0, 0)" cursor="pointer">
      <rect x="37" y="20" width="20" height="18" rx="2" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="47" y="52" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">学习</text>
    </g>

    <!-- Tab 2: 阅读 (当前激活态) -->
    <g transform="translate(94, 0)">
      <!-- 顶部高亮黑药丸横条 -->
      <rect x="27" y="10" width="40" height="4" rx="2" fill="#0F172A"/>
      <!-- 书本图标 (实体深色) -->
      <rect x="37" y="20" width="20" height="18" rx="2" fill="#0F172A"/>
      <line x1="41" y1="26" x2="53" y2="26" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="41" y1="31" x2="49" y2="31" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="47" y="52" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">阅读</text>
    </g>

    <!-- Tab 3: 生词本 -->
    <g transform="translate(188, 0)" cursor="pointer">
      <rect x="37" y="20" width="20" height="18" rx="2" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="47" y="34" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">A</text>
      <circle cx="55" cy="20" r="3" fill="#E11D48"/>
      <text x="47" y="52" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">生词本</text>
    </g>

    <!-- Tab 4: 我的 -->
    <g transform="translate(281, 0)" cursor="pointer">
      <circle cx="47" cy="26" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <path d="M37,39 C37,34 42,34 47,34 C52,34 57,34 57,39" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="47" y="52" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">我的</text>
    </g>

    <!-- 底部安全区 Home Indicator -->
    <rect x="120" y="70" width="135" height="4" rx="2" fill="#CBD5E1"/>
  </g>
</svg>

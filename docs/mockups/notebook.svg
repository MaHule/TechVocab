<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" style="background:#F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- 背景底色 -->
  <rect width="375" height="812" fill="#F8FAFC"/>

  <!-- ==================== 1. 顶部状态栏 & 导航栏 (0 ~ 88px) ==================== -->
  <g id="nav-bar">
    <text x="24" y="32" font-size="12" fill="#64748B" font-weight="500">9:41</text>
    <rect x="318" y="22" width="22" height="11" rx="3" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <rect x="320" y="24" width="15" height="7" rx="1.5" fill="#64748B"/>
    <circle cx="304" cy="27" r="3" fill="#64748B"/>

    <!-- 页面标题与词数统计 -->
    <text x="16" y="68" font-size="18" font-weight="700" fill="#0F172A">技术生词本</text>
    <rect x="110" y="52" width="46" height="20" rx="10" fill="#F1F5F9"/>
    <text x="133" y="66" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">24 词</text>

    <!-- 微信小程序胶囊 -->
    <rect x="282" y="46" width="80" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="305" cy="61" r="3.5" fill="#64748B"/>
    <circle cx="312" cy="61" r="1.5" fill="#94A3B8"/>
    <circle cx="337" cy="61" r="5" fill="none" stroke="#64748B" stroke-width="1.5"/>
  </g>

  <!-- ==================== 2. 搜索框与筛选 Tab (88 ~ 140px) ==================== -->
  <g id="filter-bar" transform="translate(16, 88)">
    <!-- 极简搜索框 -->
    <rect width="343" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="12" y="22" font-size="12" fill="#94A3B8">🔍 搜索技术生词、释义或代码关键字...</text>

    <!-- 筛选 Pills -->
    <g transform="translate(0, 46)">
      <!-- Tab 1: 全部 (24) -->
      <rect x="0" y="0" width="68" height="26" rx="6" fill="#F1F5F9"/>
      <text x="34" y="17" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">全部 24</text>

      <!-- Tab 2: 待复习 (8) - 当前选中 -->
      <rect x="76" y="0" width="82" height="26" rx="6" fill="#0F172A"/>
      <text x="117" y="17" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">待复习 (8)</text>

      <!-- Tab 3: 已掌握 (16) -->
      <rect x="166" y="0" width="80" height="26" rx="6" fill="#F1F5F9"/>
      <text x="206" y="17" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">已掌握 16</text>
    </g>
  </g>

  <!-- ==================== 3. 核心复习 CTA 卡片 (174 ~ 254px) ==================== -->
  <g id="review-cta-card" transform="translate(16, 174)" filter="url(#card-shadow)">
    <rect width="343" height="74" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    
    <text x="16" y="28" font-size="13" font-weight="700" fill="#0F172A">⚡ 今日待回炉复习：8 个生词</text>
    <text x="16" y="48" font-size="11" fill="#64748B">包含 5 个阅读收藏生词 + 3 个背词遗忘生词</text>

    <!-- 主行动大按钮 -->
    <g transform="translate(235, 18)" cursor="pointer">
      <rect width="94" height="38" rx="6" fill="#0F172A"/>
      <text x="47" y="24" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">开始复习 ›</text>
    </g>
  </g>

  <!-- ==================== 4. 生词列表项容器 (262 ~ 716px) ==================== -->
  <g id="word-list" transform="translate(16, 260)">
    
    <!-- Item 1: idempotent (待复习) -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect width="343" height="88" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- 单词与音标 -->
      <text x="14" y="26" font-size="16" font-weight="800" fill="#0F172A" font-family="'JetBrains Mono', monospace">idempotent</text>
      <text x="114" y="26" font-size="11" fill="#64748B" font-family="'JetBrains Mono', monospace">/ˌaɪ.dəmˈpoʊ.tənt/</text>
      
      <!-- 计算机第一释义 -->
      <text x="14" y="48" font-size="12" font-weight="600" fill="#334155">【计】幂等的：多次执行产生相同影响</text>
      
      <!-- 来源与状态标签 -->
      <rect x="14" y="58" width="94" height="18" rx="4" fill="#F1F5F9"/>
      <text x="61" y="70" font-size="10" fill="#475569" text-anchor="middle">来源: 文档阅读</text>

      <rect x="114" y="58" width="58" height="18" rx="4" fill="#FFFBEB"/>
      <text x="143" y="70" font-size="10" font-weight="600" fill="#D97706" text-anchor="middle">待复习</text>

      <!-- 右侧快捷按钮 -->
      <g transform="translate(270, 26)" cursor="pointer">
        <rect width="60" height="28" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
        <text x="30" y="18" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">已掌握</text>
      </g>
    </g>

    <!-- Item 2: deadlock (待复习) -->
    <g transform="translate(0, 98)" filter="url(#card-shadow)">
      <rect width="343" height="88" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="26" font-size="16" font-weight="800" fill="#0F172A" font-family="'JetBrains Mono', monospace">deadlock</text>
      <text x="88" y="26" font-size="11" fill="#64748B" font-family="'JetBrains Mono', monospace">/ˈded.lɑːk/</text>

      <text x="14" y="48" font-size="12" font-weight="600" fill="#334155">【计】死锁：多进程相互等待锁释放导致停滞</text>

      <rect x="14" y="58" width="110" height="18" rx="4" fill="#F1F5F9"/>
      <text x="69" y="70" font-size="10" fill="#475569" text-anchor="middle">来源: Level 2 操作系统</text>

      <rect x="130" y="58" width="58" height="18" rx="4" fill="#FFF1F2"/>
      <text x="159" y="70" font-size="10" font-weight="600" fill="#E11D48" text-anchor="middle">遗忘 2 次</text>

      <g transform="translate(270, 26)" cursor="pointer">
        <rect width="60" height="28" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
        <text x="30" y="18" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">已掌握</text>
      </g>
    </g>

    <!-- Item 3: traversal (已掌握) -->
    <g transform="translate(0, 196)">
      <rect width="343" height="88" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="26" font-size="16" font-weight="800" fill="#0F172A" font-family="'JetBrains Mono', monospace">traversal</text>
      <text x="96" y="26" font-size="11" fill="#64748B" font-family="'JetBrains Mono', monospace">/trəˈvɜːr.səl/</text>

      <text x="14" y="48" font-size="12" font-weight="600" fill="#334155">【计】遍历：按确定规则访问树或图的所有节点</text>

      <rect x="14" y="58" width="110" height="18" rx="4" fill="#F1F5F9"/>
      <text x="69" y="70" font-size="10" fill="#475569" text-anchor="middle">来源: Level 2 核心算法</text>

      <rect x="130" y="58" width="58" height="18" rx="4" fill="#ECFDF5"/>
      <text x="159" y="70" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">已掌握 ✓</text>

      <g transform="translate(270, 26)" cursor="pointer">
        <text x="30" y="18" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">移出 ›</text>
      </g>
    </g>

    <!-- Item 4: concurrency (待复习) -->
    <g transform="translate(0, 294)" filter="url(#card-shadow)">
      <rect width="343" height="88" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="26" font-size="16" font-weight="800" fill="#0F172A" font-family="'JetBrains Mono', monospace">concurrency</text>
      <text x="116" y="26" font-size="11" fill="#64748B" font-family="'JetBrains Mono', monospace">/kənˈkɝː.ən.si/</text>

      <text x="14" y="48" font-size="12" font-weight="600" fill="#334155">【计】并发：系统结构上支持同时处理多任务</text>

      <rect x="14" y="58" width="94" height="18" rx="4" fill="#F1F5F9"/>
      <text x="61" y="70" font-size="10" fill="#475569" text-anchor="middle">来源: 文档阅读</text>

      <rect x="114" y="58" width="58" height="18" rx="4" fill="#FFFBEB"/>
      <text x="143" y="70" font-size="10" font-weight="600" fill="#D97706" text-anchor="middle">待复习</text>

      <g transform="translate(270, 26)" cursor="pointer">
        <rect width="60" height="28" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
        <text x="30" y="18" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">已掌握</text>
      </g>
    </g>

    <!-- 底部列表触底提示 -->
    <text x="171" y="405" font-size="11" fill="#94A3B8" text-anchor="middle">已加载全部 24 个生词 · 定期回炉效率翻倍</text>
  </g>

  <!-- ==================== 5. 底部 TabBar 导航 (H: 84) ==================== -->
  <g id="tab-bar" transform="translate(0, 728)">
    <rect width="375" height="84" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="375" y2="0" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Tab 1: 学习 -->
    <g transform="translate(0, 0)">
      <rect x="37" y="20" width="20" height="18" rx="2" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="47" y="52" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">学习</text>
    </g>

    <!-- Tab 2: 阅读 -->
    <g transform="translate(94, 0)">
      <rect x="37" y="20" width="20" height="18" rx="2" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="41" y1="26" x2="53" y2="26" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="41" y1="31" x2="49" y2="31" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="47" y="52" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">阅读</text>
    </g>

    <!-- Tab 3: 生词本 (当前激活态) -->
    <g transform="translate(188, 0)">
      <rect x="27" y="10" width="40" height="4" rx="2" fill="#0F172A"/>
      <rect x="37" y="20" width="20" height="18" rx="2" fill="#0F172A"/>
      <text x="47" y="34" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
      <!-- 小红点提示有待复习词汇 -->
      <circle cx="55" cy="20" r="3" fill="#E11D48"/>
      <text x="47" y="52" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">生词本</text>
    </g>

    <!-- Tab 4: 我的 -->
    <g transform="translate(281, 0)">
      <circle cx="47" cy="26" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <path d="M37,39 C37,34 42,34 47,34 C52,34 57,34 57,39" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="47" y="52" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">我的</text>
    </g>

    <rect x="120" y="70" width="135" height="4" rx="2" fill="#CBD5E1"/>
  </g>
</svg>

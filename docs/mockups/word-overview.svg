<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" style="background:#F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <filter id="float-shadow" x="-5%" y="-10%" width="110%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="-4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- 全局背景 -->
  <rect width="375" height="812" fill="#F8FAFC"/>

  <!-- ==================== 1. 顶部状态栏 & 导航栏 (0 ~ 88px) ==================== -->
  <g id="nav-bar">
    <!-- iOS 状态栏 -->
    <text x="24" y="32" font-size="12" fill="#64748B" font-weight="500">9:41</text>
    <rect x="318" y="22" width="22" height="11" rx="3" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <rect x="320" y="24" width="15" height="7" rx="1.5" fill="#64748B"/>
    <circle cx="304" cy="27" r="3" fill="#64748B"/>

    <!-- 返回上一级按钮 -->
    <g transform="translate(16, 46)" cursor="pointer">
      <rect width="32" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <path d="M19 9L13 15L19 21" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 导航栏标题与层级 -->
    <g transform="translate(56, 46)">
      <text x="0" y="21" font-size="17" font-weight="800" fill="#0F172A">网络与分布式协议</text>
    </g>

    <!-- 微信小程序原生胶囊 -->
    <rect x="282" y="46" width="80" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="305" cy="61" r="3.5" fill="#64748B"/>
    <circle cx="312" cy="61" r="1.5" fill="#94A3B8"/>
    <circle cx="337" cy="61" r="5" fill="none" stroke="#64748B" stroke-width="1.5"/>
  </g>

  <!-- ==================== 2. 词库模块核心看板 Hero Header (88 ~ 212px) ==================== -->
  <g id="module-hero" transform="translate(16, 88)" filter="url(#card-shadow)">
    <!-- 卡片主体 -->
    <rect width="343" height="116" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 标签栏 -->
    <g transform="translate(14, 14)">
      <!-- Level Badge -->
      <rect x="0" y="0" width="70" height="20" rx="4" fill="#0F172A"/>
      <text x="35" y="14" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Level 2 · 进阶</text>

      <!-- 领域属性 -->
      <rect x="76" y="0" width="102" height="20" rx="4" fill="#EFF6FF"/>
      <text x="127" y="14" font-size="10" font-weight="600" fill="#2563EB" text-anchor="middle">TCP/IP · RFC 7231</text>

      <!-- 右侧总词数 -->
      <rect x="265" y="0" width="50" height="20" rx="10" fill="#F1F5F9"/>
      <text x="290" y="14" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">共 11 词</text>
    </g>

    <!-- 模块简述 -->
    <text x="14" y="56" font-size="12" fill="#64748B">覆盖 HTTP 语义规范、三次握手、时延流控与套接字抽象</text>

    <!-- 单元掌握进度条 -->
    <g transform="translate(14, 72)">
      <rect x="0" y="0" width="315" height="6" rx="3" fill="#F1F5F9"/>
      <rect x="0" y="0" width="201" height="6" rx="3" fill="#0F172A"/> <!-- 64% -->
    </g>

    <!-- 进度数值指标与状态 -->
    <g transform="translate(14, 98)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#059669">已掌握 7 词 (64%)</text>
      <circle cx="112" cy="-4" r="2" fill="#CBD5E1"/>
      <text x="122" y="0" font-size="12" font-weight="600" fill="#D97706">待学习 / 巩固 4 词</text>
      <text x="315" y="0" font-size="11" font-weight="600" fill="#2563EB" text-anchor="end">SM-2 排程中 ›</text>
    </g>
  </g>

  <!-- ==================== 3. 搜索框与状态筛选 Tab (216 ~ 286px) ==================== -->
  <g id="filter-section" transform="translate(16, 216)">
    <!-- 极简搜索框 -->
    <rect width="343" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="12" y="21" font-size="12" fill="#94A3B8">🔍 搜索本词库单词、中英文释义或技术场景...</text>

    <!-- 筛选 Pills 胶囊栏 -->
    <g transform="translate(0, 42)">
      <!-- Tab 1: 全部 (11) - Active -->
      <rect x="0" y="0" width="68" height="26" rx="6" fill="#0F172A"/>
      <text x="34" y="17" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">全部 11</text>

      <!-- Tab 2: 待学习/复习 (4) -->
      <rect x="76" y="0" width="92" height="26" rx="6" fill="#F1F5F9"/>
      <text x="122" y="17" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">待学习 (4)</text>

      <!-- Tab 3: 已掌握 (7) -->
      <rect x="176" y="0" width="80" height="26" rx="6" fill="#F1F5F9"/>
      <text x="216" y="17" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">已掌握 7</text>

      <!-- 排序指示 -->
      <text x="343" y="17" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="end">默认排序 ▾</text>
    </g>
  </g>

  <!-- ==================== 4. 单词总览列表区 (298 ~ 712px) ==================== -->
  <g id="word-list" transform="translate(16, 298)">

    <!-- 分组 01 标签 -->
    <text x="2" y="14" font-size="10" font-weight="700" fill="#94A3B8" font-family="'JetBrains Mono', monospace" letter-spacing="1">SECTION 01 · 协议语义与数据流</text>

    <!-- ===== 单词项 1: idempotent ===== -->
    <g transform="translate(0, 24)" filter="url(#card-shadow)" cursor="pointer">
      <rect width="343" height="84" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- 单词名称与音标 -->
      <text x="14" y="24" font-size="15" font-weight="800" fill="#0F172A" font-family="'JetBrains Mono', monospace">idempotent</text>
      <text x="115" y="24" font-size="11" fill="#64748B" font-family="'JetBrains Mono', monospace">/ˌaɪ.dəmˈpoʊ.tənt/</text>
      <text x="208" y="24" font-size="10" font-weight="600" fill="#94A3B8">adj.</text>

      <!-- 状态标签：待复习 -->
      <rect x="283" y="10" width="46" height="18" rx="4" fill="#FFFBEB"/>
      <text x="306" y="23" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">待复习</text>

      <!-- 双轨释义精炼摘要行 -->
      <g transform="translate(14, 34)">
        <rect x="0" y="4" width="46" height="16" rx="3" fill="#F1F5F9"/>
        <text x="23" y="16" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">生活常释</text>
        <text x="52" y="16" font-size="11" fill="#64748B">等幂、产生相同效力</text>
      </g>

      <g transform="translate(14, 54)">
        <rect x="0" y="4" width="46" height="16" rx="3" fill="#EFF6FF"/>
        <text x="23" y="16" font-size="9" font-weight="700" fill="#2563EB" text-anchor="middle">技术释义</text>
        <text x="52" y="16" font-size="11" font-weight="600" fill="#0F172A">幂等性：多次执行副作用完全相同 (RFC 7231)</text>
      </g>

      <!-- 右箭头 -->
      <path d="M331 42L335 46L331 50" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ===== 单词项 2: handshake ===== -->
    <g transform="translate(0, 116)" filter="url(#card-shadow)" cursor="pointer">
      <rect width="343" height="84" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      
      <text x="14" y="24" font-size="15" font-weight="800" fill="#0F172A" font-family="'JetBrains Mono', monospace">handshake</text>
      <text x="110" y="24" font-size="11" fill="#64748B" font-family="'JetBrains Mono', monospace">/ˈhænd.ʃeɪk/</text>
      <text x="188" y="24" font-size="10" font-weight="600" fill="#94A3B8">n.</text>

      <!-- 状态标签：已掌握 + 客观真验徽章 -->
      <g transform="translate(230, 10)">
        <rect x="0" y="0" width="50" height="18" rx="4" fill="#ECFDF5"/>
        <text x="25" y="13" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">已掌握 ✓</text>

        <rect x="54" y="0" width="45" height="18" rx="4" fill="#FEF3C7"/>
        <text x="76.5" y="13" font-size="9" font-weight="800" fill="#B45309" text-anchor="middle">🛡️客验</text>
      </g>

      <!-- 双轨释义摘要 -->
      <g transform="translate(14, 34)">
        <rect x="0" y="4" width="46" height="16" rx="3" fill="#F1F5F9"/>
        <text x="23" y="16" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">生活常释</text>
        <text x="52" y="16" font-size="11" fill="#64748B">握手礼节、碰面协议</text>
      </g>

      <g transform="translate(14, 54)">
        <rect x="0" y="4" width="46" height="16" rx="3" fill="#EFF6FF"/>
        <text x="23" y="16" font-size="9" font-weight="700" fill="#2563EB" text-anchor="middle">技术释义</text>
        <text x="52" y="16" font-size="11" font-weight="600" fill="#0F172A">握手协商：TCP 三次握手同步序列号建立连接</text>
      </g>

      <path d="M331 42L335 46L331 50" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ===== 单词项 3: latency ===== -->
    <g transform="translate(0, 208)" filter="url(#card-shadow)" cursor="pointer">
      <rect width="343" height="84" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      
      <text x="14" y="24" font-size="15" font-weight="800" fill="#0F172A" font-family="'JetBrains Mono', monospace">latency</text>
      <text x="88" y="24" font-size="11" fill="#64748B" font-family="'JetBrains Mono', monospace">/ˈleɪ.tən.si/</text>
      <text x="165" y="24" font-size="10" font-weight="600" fill="#94A3B8">n.</text>

      <rect x="283" y="10" width="46" height="18" rx="4" fill="#FFFBEB"/>
      <text x="306" y="23" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">待复习</text>

      <g transform="translate(14, 34)">
        <rect x="0" y="4" width="46" height="16" rx="3" fill="#F1F5F9"/>
        <text x="23" y="16" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">生活常释</text>
        <text x="52" y="16" font-size="11" fill="#64748B">潜伏、反应滞后时间</text>
      </g>

      <g transform="translate(14, 54)">
        <rect x="0" y="4" width="46" height="16" rx="3" fill="#EFF6FF"/>
        <text x="23" y="16" font-size="9" font-weight="700" fill="#2563EB" text-anchor="middle">技术释义</text>
        <text x="52" y="16" font-size="11" font-weight="600" fill="#0F172A">网络时延：数据包往返单程协议物理耗时</text>
      </g>

      <path d="M331 42L335 46L331 50" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ===== 单词项 4: payload ===== -->
    <g transform="translate(0, 300)" filter="url(#card-shadow)" cursor="pointer">
      <rect width="343" height="84" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      
      <text x="14" y="24" font-size="15" font-weight="800" fill="#0F172A" font-family="'JetBrains Mono', monospace">payload</text>
      <text x="88" y="24" font-size="11" fill="#64748B" font-family="'JetBrains Mono', monospace">/ˈpeɪ.loʊd/</text>
      <text x="160" y="24" font-size="10" font-weight="600" fill="#94A3B8">n.</text>

      <g transform="translate(230, 10)">
        <rect x="0" y="0" width="50" height="18" rx="4" fill="#ECFDF5"/>
        <text x="25" y="13" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">已掌握 ✓</text>

        <rect x="54" y="0" width="45" height="18" rx="4" fill="#FEF3C7"/>
        <text x="76.5" y="13" font-size="9" font-weight="800" fill="#B45309" text-anchor="middle">🛡️客验</text>
      </g>

      <g transform="translate(14, 34)">
        <rect x="0" y="4" width="46" height="16" rx="3" fill="#F1F5F9"/>
        <text x="23" y="16" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">生活常释</text>
        <text x="52" y="16" font-size="11" fill="#64748B">交通工具有效载荷</text>
      </g>

      <g transform="translate(14, 54)">
        <rect x="0" y="4" width="46" height="16" rx="3" fill="#EFF6FF"/>
        <text x="23" y="16" font-size="9" font-weight="700" fill="#2563EB" text-anchor="middle">技术释义</text>
        <text x="52" y="16" font-size="11" font-weight="600" fill="#0F172A">有效负载：报文中去除协议头后的真实业务数据</text>
      </g>

      <path d="M331 42L335 46L331 50" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ===== 单词项 5: socket (未学/待复习) ===== -->
    <g transform="translate(0, 392)" opacity="0.65" filter="url(#card-shadow)">
      <rect width="343" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="20" font-size="13" font-weight="700" fill="#0F172A" font-family="'JetBrains Mono', monospace">socket</text>
      <text x="75" y="20" font-size="11" fill="#64748B">/ˈsɑː.kɪt/</text>
      <text x="140" y="20" font-size="11" fill="#334155">【计】套接字：IP+端口网络抽象端点</text>
      <text x="330" y="20" font-size="11" fill="#94A3B8" text-anchor="end">更多 6 词 ›</text>
    </g>
  </g>

  <!-- ==================== 5. 底部悬浮学习行动栏 (Floating CTA Bar) ==================== -->
  <g id="bottom-bar" transform="translate(0, 722)" filter="url(#float-shadow)">
    <!-- 玻璃质感纯白底板 -->
    <rect width="375" height="90" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="375" y2="0" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 左侧进度轻提示 -->
    <g transform="translate(20, 16)">
      <text x="0" y="16" font-size="13" font-weight="800" fill="#0F172A">本模块待攻克 4 词</text>
      <text x="0" y="32" font-size="11" fill="#64748B">包含 2 个待复习 + 2 个未学生词</text>
    </g>

    <!-- 右侧操作按钮组 -->
    <!-- 按钮 1: 客观实战挑战 -->
    <g transform="translate(196, 12)" cursor="pointer">
      <rect width="66" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="33" y="24" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">🎯 挑战</text>
    </g>

    <!-- 按钮 2: 主行动：开始背词 -->
    <g transform="translate(268, 12)" cursor="pointer">
      <rect width="91" height="40" rx="8" fill="#0F172A"/>
      <text x="45.5" y="24" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">开始背词 ›</text>
    </g>
  </g>

</svg>

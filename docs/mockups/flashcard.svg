<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" style="background:#F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- 背景底色 -->
  <rect width="375" height="812" fill="#F8FAFC"/>

  <!-- ==================== 1. 顶部状态栏 & 导航栏 (0 ~ 88px) ==================== -->
  <g id="nav-bar">
    <text x="24" y="32" font-size="12" fill="#64748B" font-weight="500">9:41</text>
    <rect x="318" y="22" width="22" height="11" rx="3" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <rect x="320" y="24" width="15" height="7" rx="1.5" fill="#64748B"/>
    <circle cx="304" cy="27" r="3" fill="#64748B"/>

    <!-- 返回按钮 -->
    <g transform="translate(16, 46)" cursor="pointer">
      <rect width="32" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <path d="M19 9L13 15L19 21" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 单元与进度指示 -->
    <g transform="translate(56, 44)">
      <rect x="0" y="2" width="140" height="18" rx="4" fill="#F1F5F9"/>
      <text x="70" y="15" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Level 2 · 计算机网络</text>
      <text x="70" y="32" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">单元进度 07 / 15</text>
    </g>

    <!-- 微信小程序胶囊按钮 -->
    <rect x="282" y="46" width="80" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="305" cy="61" r="3.5" fill="#64748B"/>
    <circle cx="312" cy="61" r="1.5" fill="#94A3B8"/>
    <circle cx="337" cy="61" r="5" fill="none" stroke="#64748B" stroke-width="1.5"/>

    <!-- 顶部进度条 -->
    <rect x="0" y="86" width="375" height="2" fill="#E2E8F0"/>
    <rect x="0" y="86" width="175" height="2" fill="#0F172A"/>
  </g>

  <!-- ==================== 2. 核心单词主卡片 (98 ~ 590px) ==================== -->
  <g id="flashcard" transform="translate(16, 98)" filter="url(#card-shadow)">
    <!-- 卡片白底与边框 -->
    <rect width="343" height="484" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 卡片顶部小顶栏 (终端控制点 + 协议标签) -->
    <circle cx="20" cy="20" r="3.5" fill="#EF4444"/>
    <circle cx="30" cy="20" r="3.5" fill="#F59E0B"/>
    <circle cx="40" cy="20" r="3.5" fill="#10B981"/>

    <text x="215" y="24" font-size="10" font-weight="600" fill="#64748B" font-family="'JetBrains Mono', monospace">RFC 7231 · SPEC</text>
    <line x1="0" y1="36" x2="343" y2="36" stroke="#F1F5F9" stroke-width="1"/>

    <!-- 单词大标题 -->
    <text x="20" y="78" font-size="28" font-weight="800" fill="#0F172A" font-family="'JetBrains Mono', monospace">idempotent</text>

    <!-- 音标、词性与发音 -->
    <g transform="translate(20, 94)">
      <text x="0" y="16" font-size="13" font-weight="400" fill="#64748B" font-family="'JetBrains Mono', monospace">/ˌaɪ.dəmˈpoʊ.tənt/</text>
      <rect x="135" y="4" width="32" height="18" rx="4" fill="#F1F5F9"/>
      <text x="151" y="16" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">adj.</text>

      <!-- 发音喇叭圆钮 -->
      <g transform="translate(178, 2)" cursor="pointer">
        <circle cx="10" cy="11" r="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
        <path d="M7 8.5V13.5L10 13.5L13 16V6L10 8.5H7Z" fill="#334155"/>
      </g>
    </g>

    <!-- 计算机专属第一释义区 -->
    <g transform="translate(16, 134)">
      <rect width="311" height="96" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- 标签 Badge -->
      <rect x="12" y="12" width="76" height="18" rx="4" fill="#0F172A"/>
      <text x="50" y="24" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">计算机专属释义</text>

      <text x="12" y="48" font-size="15" font-weight="700" fill="#0F172A">幂等的</text>
      <text x="64" y="48" font-size="12" font-weight="400" fill="#475569">（操作执行多次与一次影响相同）</text>

      <g transform="translate(12, 64)">
        <text x="0" y="14" font-size="11" fill="#64748B">💡 典型语境：</text>
        <text x="64" y="14" font-size="11" font-weight="600" fill="#0F172A">HTTP PUT/DELETE · 消息重试 · 接口防重</text>
      </g>
    </g>

    <!-- 真实工程代码例句区 (浅色代码块) -->
    <g transform="translate(16, 244)">
      <rect width="311" height="180" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- 窗口小顶栏 -->
      <rect width="311" height="26" rx="8" fill="#F1F5F9"/>
      <rect x="0" y="16" width="311" height="10" fill="#F1F5F9"/>
      <text x="12" y="17" font-size="10" font-weight="600" fill="#64748B" font-family="'JetBrains Mono', monospace">EXAMPLE.http_handler.go</text>
      <line x1="0" y1="26" x2="311" y2="26" stroke="#E2E8F0" stroke-width="1"/>

      <!-- 代码内容 -->
      <g transform="translate(12, 46)" font-family="'JetBrains Mono', monospace" font-size="11">
        <text x="0" y="0" fill="#94A3B8">01</text>
        <text x="22" y="0" fill="#64748B">// RFC 7231: Safe &amp; Idempotent Methods</text>

        <text x="0" y="20" fill="#94A3B8">02</text>
        <text x="22" y="20" fill="#0F172A" font-weight="700">func </text>
        <text x="56" y="20" fill="#334155">HandleRequest(req *Request) {</text>

        <text x="0" y="42" fill="#94A3B8">03</text>
        <text x="22" y="42" fill="#0F172A" font-weight="700">  if </text>
        <text x="46" y="42" fill="#334155">req.</text>
        
        <!-- 高亮关键词 -->
        <rect x="72" y="30" width="88" height="16" rx="3" fill="#0F172A"/>
        <text x="76" y="42" font-weight="700" fill="#FFFFFF">IsIdempotent</text>
        <text x="164" y="42" fill="#334155">() {</text>

        <text x="0" y="64" fill="#94A3B8">04</text>
        <text x="22" y="64" fill="#475569">    retryPolicy.</text>
        <text x="108" y="64" fill="#059669" font-weight="600">EnableSafeRetry</text>
        <text x="204" y="64" fill="#334155">()</text>

        <text x="0" y="86" fill="#94A3B8">05</text>
        <text x="22" y="86" fill="#334155">  }</text>

        <text x="0" y="108" fill="#94A3B8">06</text>
        <text x="22" y="108" fill="#334155">}</text>
      </g>
    </g>

    <!-- 卡片底部提示 -->
    <text x="171" y="452" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">轻触卡片查看完整解析与反面</text>
  </g>

  <!-- ==================== 3. 底部三态熟练度操作栏 (598 ~ 710px) ==================== -->
  <g id="action-buttons" transform="translate(16, 604)">
    <!-- 按钮 1: 没记住 -->
    <g transform="translate(0, 0)" cursor="pointer">
      <rect width="104" height="52" rx="8" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1"/>
      <text x="52" y="27" font-size="13" font-weight="700" fill="#E11D48" text-anchor="middle">没记住</text>
      <text x="52" y="42" font-size="9" font-weight="600" fill="#FDA4AF" text-anchor="middle" font-family="'JetBrains Mono', monospace">1</text>
    </g>

    <!-- 按钮 2: 模糊 -->
    <g transform="translate(119, 0)" cursor="pointer">
      <rect width="104" height="52" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
      <text x="52" y="27" font-size="13" font-weight="700" fill="#D97706" text-anchor="middle">模糊</text>
      <text x="52" y="42" font-size="9" font-weight="600" fill="#FCD34D" text-anchor="middle" font-family="'JetBrains Mono', monospace">2</text>
    </g>

    <!-- 按钮 3: 已掌握 (主行动按钮) -->
    <g transform="translate(239, 0)" cursor="pointer">
      <rect width="104" height="52" rx="8" fill="#0F172A" stroke="#0F172A" stroke-width="1"/>
      <text x="52" y="27" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">已掌握 ✓</text>
      <text x="52" y="42" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle" font-family="'JetBrains Mono', monospace">3</text>
    </g>
  </g>

  <!-- ==================== 4. 底部引导与指示线 ==================== -->
  <g id="footer-gesture">
    <text x="187" y="744" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">
      ← 左右滑动屏幕或轻触下方快速标记 →
    </text>
    <rect x="120" y="796" width="135" height="4" rx="2" fill="#CBD5E1"/>
  </g>
</svg>

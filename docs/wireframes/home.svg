<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" style="background:#F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- 背景底色 -->
  <rect width="375" height="812" fill="#F8FAFC"/>

  <!-- ==================== 1. 顶部状态栏 & 导航栏 (H: 88) ==================== -->
  <g id="nav-bar">
    <!-- 状态栏占位 -->
    <text x="24" y="32" font-size="12" fill="#64748B" font-weight="500">9:41</text>
    <rect x="318" y="22" width="22" height="11" rx="3" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <rect x="320" y="24" width="15" height="7" rx="1.5" fill="#64748B"/>
    <circle cx="304" cy="27" r="3" fill="#64748B"/>

    <!-- 微信小程序胶囊按钮示意 -->
    <rect x="282" y="46" width="80" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="305" cy="61" r="3.5" fill="#64748B"/>
    <circle cx="312" cy="61" r="1.5" fill="#94A3B8"/>
    <circle cx="337" cy="61" r="5" fill="none" stroke="#64748B" stroke-width="1.5"/>

    <!-- 页面大标题 -->
    <text x="16" y="68" font-size="18" font-weight="700" fill="#0F172A">TechVocab 码词</text>
  </g>

  <!-- ==================== 2. 今日背词核心 Hero 卡片 (H: 136) ==================== -->
  <g id="hero-card" filter="url(#card-shadow)">
    <!-- 卡片容器 -->
    <rect x="16" y="96" width="343" height="136" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- 连续打卡 Badge (右上) -->
    <rect x="250" y="108" width="95" height="24" rx="12" fill="#F1F5F9"/>
    <text x="297" y="124" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">🔥 连续打卡 5 天</text>

    <!-- 今日目标文字 -->
    <text x="32" y="126" font-size="13" font-weight="600" fill="#475569">今日学习目标</text>
    
    <!-- 词数统计 -->
    <text x="32" y="152" font-size="24" font-weight="800" fill="#0F172A">12 <tspan font-size="14" font-weight="500" fill="#94A3B8">/ 20 词</tspan></text>
    <text x="135" y="150" font-size="11" fill="#64748B">已完成 60%</text>

    <!-- 进度条底槽 & 填充 -->
    <rect x="32" y="160" width="311" height="6" rx="3" fill="#F1F5F9"/>
    <rect x="32" y="160" width="186" height="6" rx="3" fill="#0F172A"/>

    <!-- 主行动 CTA 按钮 (Primary CTA) -->
    <rect x="32" y="178" width="311" height="40" rx="8" fill="#0F172A"/>
    <text x="187" y="203" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">继续今日背词 (剩余 8 词)  →</text>
  </g>

  <!-- ==================== 3. 待复习生词提示条 (H: 48) ==================== -->
  <g id="review-banner">
    <rect x="16" y="244" width="343" height="48" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="34" cy="268" r="4" fill="#64748B"/>
    <text x="46" y="272" font-size="12" font-weight="500" fill="#334155">生词本有 <tspan font-weight="700" fill="#0F172A">8</tspan> 个技术生词待回炉巩固</text>
    
    <!-- 次级按钮 -->
    <rect x="275" y="254" width="72" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="311" y="272" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">去复习</text>
  </g>

  <!-- ==================== 4. 技术词库模块列表 (H: 260) ==================== -->
  <g id="module-section">
    <!-- 模块标题栏 -->
    <text x="16" y="316" font-size="15" font-weight="700" fill="#0F172A">技术领域词库</text>
    <text x="359" y="316" font-size="12" font-weight="500" fill="#64748B" text-anchor="end">全部词库 ›</text>

    <!-- 模块卡片 1: 当前正在学 (激活高亮态) -->
    <g transform="translate(16, 328)">
      <rect width="343" height="74" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
      <!-- Level 标签 -->
      <rect x="12" y="10" width="56" height="18" rx="4" fill="#F1F5F9"/>
      <text x="40" y="23" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Level 2</text>
      <!-- 模块名称 -->
      <text x="74" y="24" font-size="14" font-weight="700" fill="#0F172A">计算机网络 (TCP / HTTP)</text>
      <!-- 进度文字与进度槽 -->
      <text x="12" y="44" font-size="11" fill="#64748B">单元进度：45 / 120 词 (37%)</text>
      <rect x="12" y="52" width="220" height="4" rx="2" fill="#F1F5F9"/>
      <rect x="12" y="52" width="81" height="4" rx="2" fill="#0F172A"/>
      <!-- 操作按钮 -->
      <rect x="259" y="20" width="72" height="34" rx="6" fill="#0F172A"/>
      <text x="295" y="42" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">学习中</text>
    </g>

    <!-- 模块卡片 2: 已通关模块 -->
    <g transform="translate(16, 412)">
      <rect width="343" height="66" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="12" y="12" width="56" height="18" rx="4" fill="#F1F5F9"/>
      <text x="40" y="25" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">Level 1</text>
      <text x="74" y="26" font-size="13" font-weight="600" fill="#334155">编程入门基础 &amp; 高频报错</text>
      <text x="12" y="48" font-size="11" fill="#94A3B8">共 180 词 · 100% 已掌握</text>
      <!-- 状态标签 -->
      <rect x="267" y="20" width="64" height="26" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="299" y="37" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">已通关 ✓</text>
    </g>

    <!-- 模块卡片 3: 未开始模块 -->
    <g transform="translate(16, 488)">
      <rect width="343" height="66" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="12" y="12" width="56" height="18" rx="4" fill="#F1F5F9"/>
      <text x="40" y="25" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">Level 2</text>
      <text x="74" y="26" font-size="13" font-weight="600" fill="#334155">操作系统与并发编程</text>
      <text x="12" y="48" font-size="11" fill="#94A3B8">共 100 词 · 尚未开始</text>
      <!-- 切换按钮 -->
      <rect x="267" y="20" width="64" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="299" y="37" font-size="11" font-weight="500" fill="#334155" text-anchor="middle">切换 ›</text>
    </g>
  </g>

  <!-- ==================== 5. 文章阅读快捷入口 (H: 80) ==================== -->
  <g id="reader-banner" transform="translate(16, 566)">
    <rect width="343" height="74" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#0F172A">📖 真实技术文档阅读</text>
    <text x="16" y="46" font-size="11" fill="#64748B">支持粘贴外部英文报错/文档，点词即查专业释义</text>
    <rect x="251" y="22" width="80" height="30" rx="6" fill="#0F172A"/>
    <text x="291" y="41" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">粘贴阅读</text>
  </g>

  <!-- ==================== 6. 底部 TabBar 导航 (H: 84) ==================== -->
  <g id="tab-bar" transform="translate(0, 728)">
    <!-- TabBar 背景与顶部细线 -->
    <rect width="375" height="84" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="375" y2="0" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Tab 1: 学习 (当前激活) -->
    <g transform="translate(0, 0)">
      <rect x="27" y="10" width="40" height="4" rx="2" fill="#0F172A"/>
      <rect x="37" y="20" width="20" height="18" rx="2" fill="#0F172A"/>
      <text x="47" y="52" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">学习</text>
    </g>

    <!-- Tab 2: 阅读 -->
    <g transform="translate(94, 0)">
      <rect x="37" y="20" width="20" height="18" rx="2" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="41" y1="26" x2="53" y2="26" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="41" y1="31" x2="49" y2="31" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="47" y="52" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">阅读</text>
    </g>

    <!-- Tab 3: 生词本 -->
    <g transform="translate(188, 0)">
      <rect x="37" y="20" width="20" height="18" rx="2" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="47" y="34" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">A</text>
      <!-- 红点小角标提示待复习 -->
      <circle cx="55" cy="20" r="3" fill="#64748B"/>
      <text x="47" y="52" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">生词本</text>
    </g>

    <!-- Tab 4: 我的 -->
    <g transform="translate(281, 0)">
      <circle cx="47" cy="26" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <path d="M37,39 C37,34 42,34 47,34 C52,34 57,34 57,39" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="47" y="52" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">我的</text>
    </g>

    <!-- iOS 底部指示条安全区 -->
    <rect x="120" y="70" width="135" height="4" rx="2" fill="#CBD5E1"/>
  </g>
</svg>
